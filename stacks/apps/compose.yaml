services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    labels:
      - homepage.group=Apps
      - homepage.name=Homepage
      - homepage.icon=homepage.png
      - homepage.href=http://192.168.100.127:3003
      - homepage.description=Dashboard
    ports:
      - "3003:3000"
    volumes:
      - ${APPS_DATA_ROOT:-/opt/homelab/apps}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    restart: unless-stopped

  actualbudget:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actualbudget
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Apps
      - homepage.name=Actual Budget
      - homepage.icon=actual-budget.png
      - homepage.href=http://192.168.100.127:5006
      - homepage.description=Personal finance
    ports:
      - "5006:5006"
    volumes:
      - ${APPS_DATA_ROOT:-/opt/homelab/apps}/actualbudget:/data
    restart: unless-stopped
