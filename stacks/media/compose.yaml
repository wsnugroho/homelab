  profilarr:
    container_name: profilarr
    image: santiagosayshey/profilarr:latest
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Profilarr
      - homepage.icon=mdi-tune
      - homepage.href=http://192.168.100.127:6868
      - homepage.description=Profile sync
    environment: *media-env
    ports:
      - "6868:6868"
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/profilarr:/config
    restart: unless-stopped

  decypharr:
    container_name: decypharr
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Decypharr
      - homepage.icon=mdi-magnet
      - homepage.href=http://192.168.100.127:8282
      - homepage.description=Debrid bridge
    # Use this images for torbox permalink support until MR is merged
    # https://github.com/sirrobot01/decypharr/pull/183
    # image: ghcr.io/akhanalcs/decypharr:latest
    image: cy01/blackhole:latest
    environment: *media-env
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    security_opt:
      - apparmor:unconfined
    ports:
      - "8282:8282"
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/decypharr:/app
      - /mnt:/mnt:rshared
      - /data:/data
    restart: unless-stopped
