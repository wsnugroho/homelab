  #     - "32469:32469"
  #   volumes:
  #     - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/plex/config:/config
  #     - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/plex/transcode:/transcode
  #     - /mnt:/mnt:rshared
  #     - /data/media:/data
  #   restart: unless-stopped

  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Seerr
      - homepage.icon=jellyseerr.png
      - homepage.href=http://192.168.100.127:5055
      - homepage.description=Media requests
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/seerr:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  stash:
    container_name: stash
    image: stashapp/stash:latest
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Stash
      - homepage.icon=stash.png
      - homepage.href=http://192.168.100.127:9999
      - homepage.description=Metadata and media library
    ports:
      - "9999:9999"
    environment:
      STASH_STASH: /data/
      STASH_GENERATED: /generated/
      STASH_METADATA: /metadata/
      STASH_CACHE: /cache/
      STASH_PORT: "9999"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/config:/root/.stash
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/metadata:/metadata
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/cache:/cache
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/blobs:/blobs
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/generated:/generated
      - /data/media:/data
      - /mnt:/mnt:rshared
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Radarr
      - homepage.icon=radarr.png
      - homepage.href=http://192.168.100.127:7878
      - homepage.description=Movie management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/radarr:/config
      - /data:/data
      - /mnt:/mnt:rshared
    ports:
      - "7878:7878"
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - homepage.href=http://192.168.100.127:8989
      - homepage.description=Series management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/sonarr:/config
      - /data:/data
      - /mnt:/mnt:rshared
    ports:
      - "8989:8989"
    restart: unless-stopped

  whisparr:
    container_name: whisparr
    image: ghcr.io/hotio/whisparr:v3
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Whisparr
      - homepage.icon=whisparr.png
      - homepage.href=http://192.168.100.127:6969
      - homepage.description=Adult library management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/whisparr:/config
      - /data:/data
      - /mnt:/mnt:rshared
    ports:
      - "6969:6969"
    restart: unless-stopped

  whisparr-jav:
    container_name: whisparr-jav
    image: ghcr.io/hotio/whisparr:v2-develop
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=WhisparrJAV
      - homepage.icon=whisparr.png
      - homepage.href=http://192.168.100.127:7070
      - homepage.description=Adult library management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/whisparr-jav:/config
      - /data:/data
      - /mnt:/mnt:rshared
    ports:
      - "7070:6969"
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Bazarr
      - homepage.icon=bazarr.png
      - homepage.href=http://192.168.100.127:6767
      - homepage.description=Subtitle management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/bazarr:/config
      - /mnt:/mnt:rshared
      - /data/media:/data/media
    ports:
      - "6767:6767"
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Prowlarr
      - homepage.icon=prowlarr.png
      - homepage.href=http://192.168.100.127:9696
      - homepage.description=Indexer management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=FlareSolverr
      - homepage.icon=flaresolverr.png
      - homepage.description=Anti-bot solver
    environment: *media-env
    ports:
      - "8191:8191"
    restart: unless-stopped

  autopulse:
    container_name: autopulse
    image: ghcr.io/dan-online/autopulse:stable
    dns:
      - ${ADGUARD_DNS_IP:-192.168.100.127}
    labels:
      - homepage.group=Media
      - homepage.name=Autopulse
      - homepage.icon=mdi-radar
      - homepage.href=http://192.168.100.127:2875
      - homepage.description=Instant Jellyfin update webhook
    environment:
      <<: *media-env
      AUTOPULSE__APP__HOSTNAME: 0.0.0.0
      AUTOPULSE__APP__PORT: "2875"
      AUTOPULSE__APP__DATABASE_URL: sqlite:///config/autopulse.db
      AUTOPULSE__AUTH__USERNAME: ${AUTOPULSE_AUTH_USERNAME:-admin}
      AUTOPULSE__AUTH__PASSWORD: ${AUTOPULSE_AUTH_PASSWORD:-change-me}
    ports:
      - "2875:2875"
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/autopulse/config:/app
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/autopulse/data:/config
      - /data:/data:ro
    restart: unless-stopped

  # agregarr:
  #   container_name: agregarr
  #   image: agregarr/agregarr:latest
  #   dns:
  #     - ${ADGUARD_DNS_IP:-192.168.100.127}
