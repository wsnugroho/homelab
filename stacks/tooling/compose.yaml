services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    labels:
      - "tsbridge.enabled=true"
      - "tsbridge.service.name=homepage"
      - "tsbridge.service.port=3000"
    ports:
      - 3000:3000
    volumes:
      - homepage-config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
    networks:
      - tsbridge
    restart: unless-stopped

  actualbudget:
    image: docker.io/actualbudget/actual-server:latest
    labels:
      - "tsbridge.enabled=true"
      - "tsbridge.service.name=actualbudget"
      - "tsbridge.service.port=5006"
    ports:
      - 5006:5006
    volumes:
      - actualbudget-data:/data
    networks:
      - tsbridge
    restart: unless-stopped

  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    labels:
      - "tsbridge.enabled=true"
      - "tsbridge.service.name=cliproxyapi"
      - "tsbridge.service.port=8317"
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - cli-proxy-api-data:/CLIProxyAPI
      - cli-proxy-api-auth:/root/.cli-proxy-api
    networks:
      - tsbridge
    restart: unless-stopped

volumes:
  homepage-config:
  actualbudget-data:
  cli-proxy-api-data:
  cli-proxy-api-auth:

networks:
  tsbridge:
    external: true

