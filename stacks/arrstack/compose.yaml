services:
  qbittorrent-nox:
    image: qbittorrentofficial/qbittorrent-nox:latest
    labels:
      - "tsbridge.enabled=true"
      - "tsbridge.services.name=qbittorrent"
      - "tsbridge.services.port=8080"
    ports:
      - 6881:6881/tcp
      - 6881:6881/udp
      - 8080:8080/tcp
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads
    environment:
      - PUID=3000
      - PGID=3000
      - QBT_LEGAL_NOTICE=confirm
    networks:
      - tsbridge
    restart: unless-stopped

volumes:
  qbittorrent-config: 
  qbittorrent-downloads: 
    driver: local
    driver_opts:
      type: nfs
      o: "addr=100.95.209.64,rw,nfsvers=4,hard,noatime,nodiratime,async"
      device: ":/mnt/tank/media"

networks:
  tsbridge:
    external: true

