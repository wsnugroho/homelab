x-media-env: &media-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Asia/Jakarta}

services:
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    labels:
      - homepage.group=Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - homepage.href=http://192.168.100.127:8096
      - homepage.description=Media server
    ports:
      - "8096:8096"
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/jellyfin:/config
      - /mnt:/mnt:rshared
      - /data/media:/data
    restart: unless-stopped

  jellyseerr:
    container_name: jellyseerr
    image: fallenbagel/jellyseerr:latest
    labels:
      - homepage.group=Media
      - homepage.name=Jellyseerr
      - homepage.icon=jellyseerr.png
      - homepage.href=http://192.168.100.127:5055
      - homepage.description=Media requests
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  stash:
    container_name: stash
    image: stashapp/stash:latest
    labels:
      - homepage.group=Media
      - homepage.name=Stash
      - homepage.icon=stash.png
      - homepage.href=http://192.168.100.127:9999
      - homepage.description=Metadata and media library
    ports:
      - "9999:9999"
    environment:
      STASH_STASH: /data/
      STASH_GENERATED: /generated/
      STASH_METADATA: /metadata/
      STASH_CACHE: /cache/
      STASH_PORT: "9999"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/config:/root/.stash
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/metadata:/metadata
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/cache:/cache
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/blobs:/blobs
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/stash/generated:/generated
      - /data/media:/data
      - /mnt:/mnt:rshared
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    labels:
      - homepage.group=Media
      - homepage.name=Radarr
      - homepage.icon=radarr.png
      - homepage.href=http://192.168.100.127:7878
      - homepage.description=Movie management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/radarr:/config
      - /data:/data
      - /mnt:/mnt:rshared
    ports:
      - "7878:7878"
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    labels:
      - homepage.group=Media
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - homepage.href=http://192.168.100.127:8989
      - homepage.description=Series management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/sonarr:/config
      - /data:/data
      - /mnt:/mnt:rshared
    ports:
      - "8989:8989"
    restart: unless-stopped

  whisparr:
    container_name: whisparr
    image: ghcr.io/hotio/whisparr:v3
    labels:
      - homepage.group=Media
      - homepage.name=Whisparr
      - homepage.icon=whisparr.png
      - homepage.href=http://192.168.100.127:6969
      - homepage.description=Adult library management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/whisparr:/config
      - /data:/data
      - /mnt:/mnt:rshared
    ports:
      - "6969:6969"
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    labels:
      - homepage.group=Media
      - homepage.name=Bazarr
      - homepage.icon=bazarr.png
      - homepage.href=http://192.168.100.127:6767
      - homepage.description=Subtitle management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/bazarr:/config
      - /mnt:/mnt:rshared
      - /data/media:/data/media
    ports:
      - "6767:6767"
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    labels:
      - homepage.group=Media
      - homepage.name=Prowlarr
      - homepage.icon=prowlarr.png
      - homepage.href=http://192.168.100.127:9696
      - homepage.description=Indexer management
    environment: *media-env
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    labels:
      - homepage.group=Media
      - homepage.name=FlareSolverr
      - homepage.icon=flaresolverr.png
      - homepage.description=Anti-bot solver
    environment: *media-env
    ports:
      - "8191:8191"
    restart: unless-stopped

  profilarr:
    container_name: profilarr
    image: santiagosayshey/profilarr:latest
    labels:
      - homepage.group=Media
      - homepage.name=Profilarr
      - homepage.icon=mdi-tune
      - homepage.href=http://192.168.100.127:6868
      - homepage.description=Profile sync
    environment: *media-env
    ports:
      - "6868:6868"
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/profilarr:/config
    restart: unless-stopped

  decypharr:
    container_name: decypharr
    labels:
      - homepage.group=Media
      - homepage.name=Decypharr
      - homepage.icon=mdi-magnet
      - homepage.href=http://192.168.100.127:8282
      - homepage.description=Debrid bridge
    # Use this images for torbox permalink support until MR is merged
    # https://github.com/sirrobot01/decypharr/pull/183
    image: ghcr.io/akhanalcs/decypharr:latest
    # image: cy01/blackhole:latest
    environment: *media-env
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    security_opt:
      - apparmor:unconfined
    ports:
      - "8282:8282"
    volumes:
      - ${MEDIA_DATA_ROOT:-/opt/homelab/media}/decypharr:/app
      - /mnt:/mnt:rshared
      - /data/debrid:/data/debrid
    restart: unless-stopped
