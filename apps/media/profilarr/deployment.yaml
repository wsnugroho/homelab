apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: profilarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profilarr
    spec:
      containers:
        - name: profilarr
          image: ghcr.io/dictionarry-hub/profilarr:latest
          env:
            - name: ORIGIN
              value: https://profilarr.orca-fort.ts.net
          envFrom:
            - configMapRef:
                name: media-env
          ports:
            - name: http
              containerPort: 6868
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: profilarr-config
