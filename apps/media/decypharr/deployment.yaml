apiVersion: apps/v1
kind: Deployment
metadata:
  name: decypharr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: decypharr
  template:
    metadata:
      annotations:
        container.apparmor.security.beta.kubernetes.io/decypharr: unconfined
      labels:
        app.kubernetes.io/name: decypharr
    spec:
      # Disable automatic Service environment variables (e.g. DECYPHARR_PORT=tcp://...)
      # Decypharr incorrectly reads the injected *_PORT variable after the configuration
      # wizard, causing the HTTP server to bind to ":tcp://<cluster-ip>:8282" and fail with:
      # "listen tcp: address :tcp://...: too many colons in address".
      #
      # Service discovery uses Kubernetes DNS instead, so service links are unnecessary.
      enableServiceLinks: false
      containers:
        - name: decypharr
          image: cy01/blackhole:latest
          envFrom:
            - configMapRef:
                name: media-env
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          ports:
            - name: http
              containerPort: 8282
          volumeMounts:
            - name: config
              mountPath: /app
            - name: fuse
              mountPath: /dev/fuse
            - name: data
              mountPath: /data
            - name: mnt
              mountPath: /mnt
              mountPropagation: Bidirectional
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: decypharr-config
        - name: fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: data
          hostPath:
            path: /data
            type: Directory
        - name: mnt
          hostPath:
            path: /mnt
            type: Directory
