apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  settings.yaml: |
    ---
    title: "Homelab Dashboard"
    description: "Central dashboard for homelab services"
    theme: dark
    color: slate
    hideVersion: false
    disableUpdateCheck: false
    headerStyle: underlined
    statusStyle: dot
    language: en
    target: _blank

  services.yaml: |
    ---
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: http://jellyfin:8096
            description: Media streaming server
        - Seerr:
            icon: overseerr.png
            href: http://seerr:5055
            description: Media request management
        - Radarr:
            icon: radarr.png
            href: http://radarr:7878
            description: Movie collection manager
        - Sonarr:
            icon: sonarr.png
            href: http://sonarr:8989
            description: TV series manager
        - Bazarr:
            icon: bazarr.png
            href: http://bazarr:6767
            description: Subtitle manager
        - Prowlarr:
            icon: prowlarr.png
            href: http://prowlarr:9696
            description: Indexer manager
        - Flaresolverr:
            icon: flaresolverr.png
            href: http://flaresolverr:8191
            description: Cloudflare bypass proxy
        - Profilarr:
            icon: profilarr.png
            href: http://profilarr:6868
            description: Profile management
        - Decypharr:
            icon: decypharr.png
            href: http://decypharr:8282
            description: Decryption utility

  widgets.yaml: |
    ---
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank

  bookmarks.yaml: |
    []

  kubernetes.yaml: |
    ---
    mode: cluster

  custom.css: |
    /* custom styles */

  custom.js: |
    // custom scripts
